services:
  - type: web
    name: pcu-choir-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_SERVER
        sync: false   # Set this in Render dashboard
      - key: DB_DATABASE
        sync: false   # Set this in Render dashboard
      - key: DB_USER
        sync: false   # Set this in Render dashboard
      - key: DB_PASSWORD
        sync: false   # Set this in Render dashboard
      - key: DB_PORT
        value: 1433
      - key: DB_ENCRYPT
        value: true
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: false
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false   # Set this in Render dashboard
      - key: JWT_ACCESS_EXPIRY
        value: 1d
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: ALLOWED_ORIGINS
        sync: false   # Set this to your Vercel URL after deploy
      - key: MAX_FILE_SIZE_MB
        value: 10
